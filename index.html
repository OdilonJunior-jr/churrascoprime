<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Churrasco Prime | Premium para Eventos</title>
  <meta name="description" content="Churrasco premium para eventos corporativos, aniversários, resenhas e BBQ." />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@400;500;600;700;800;900&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">

  <style>
    :root{
      --black:#090402;
      --white:#fff;
      --cream:#fff8ef;
      --cream-2:#f7eadb;
      --brown:#23100a;
      --brown-soft:#6f3a1e;
      --red:#e32b12;
      --red-dark:#9d1406;
      --orange:#ff7908;
      --amber:#ffb027;
      --text:#24100a;
      --muted:#5b3b2b;
      --card:rgba(255,255,255,.86);
      --stroke:rgba(125,59,26,.18);
      --shadow:rgba(69,28,9,.22);
    }

    *{ box-sizing:border-box; margin:0; padding:0; }
    html{ scroll-behavior:smooth; background:var(--cream); }
    body{
      min-height:100svh;
      color:var(--text);
      font-family:"Montserrat", Arial, sans-serif;
      background:var(--cream);
      overflow-x:hidden;
    }
    img{ display:block; max-width:100%; }
    a{ color:inherit; text-decoration:none; }

    .page{
      position:relative;
      min-height:100svh;
      isolation:isolate;
      overflow:hidden;
      background:
        radial-gradient(circle at 13% 12%, rgba(255,179,77,.35), transparent 24%),
        radial-gradient(circle at 87% 84%, rgba(255,104,27,.20), transparent 30%),
        linear-gradient(135deg, #fffdf8 0%, #fff2e2 44%, #ffd9b5 100%);
    }

    .page::before{
      content:"";
      position:absolute;
      inset:0;
      z-index:-3;
      background:url("assets/hero-churrasco.jpg") 70% center / cover no-repeat;
      filter:saturate(1.1) contrast(1.04) brightness(1.05);
      transform:scale(1.01);
    }

    .page::after{
      content:"";
      position:absolute;
      inset:0;
      z-index:-2;
      pointer-events:none;
      background:
        linear-gradient(90deg, rgba(255,253,248,.98) 0%, rgba(255,248,239,.94) 34%, rgba(255,238,218,.58) 58%, rgba(47,19,9,.34) 100%),
        linear-gradient(180deg, rgba(255,255,255,.28) 0%, rgba(255,255,255,.14) 46%, rgba(72,29,12,.28) 100%);
    }

    .embers{
      position:absolute;
      inset:0;
      z-index:-1;
      pointer-events:none;
      opacity:.32;
      background:
        radial-gradient(circle at 8% 23%, rgba(255,84,13,.55) 0 1px, transparent 3px),
        radial-gradient(circle at 23% 66%, rgba(255,126,0,.44) 0 1px, transparent 3px),
        radial-gradient(circle at 38% 18%, rgba(255,67,0,.38) 0 1px, transparent 3px),
        radial-gradient(circle at 67% 70%, rgba(255,116,0,.28) 0 1px, transparent 3px),
        radial-gradient(circle at 92% 62%, rgba(255,64,0,.35) 0 1px, transparent 3px);
      background-size:310px 290px, 260px 330px, 380px 360px, 460px 380px, 330px 300px;
      mix-blend-mode:multiply;
    }

    .shell{
      width:min(1180px, 100%);
      min-height:100svh;
      margin:0 auto;
      padding:clamp(28px,4vh,56px) clamp(18px,4vw,56px);
      display:flex;
      align-items:center;
      justify-content:flex-start;
    }

    .content{
      width:min(648px, 100%);
      text-align:center;
      padding:clamp(26px,3.2vw,44px);
      border:1px solid rgba(255,255,255,.76);
      border-radius:34px;
      background:
        linear-gradient(180deg, rgba(255,255,255,.92), rgba(255,249,241,.84)),
        radial-gradient(circle at 50% -10%, rgba(255,196,93,.18), transparent 34%);
      box-shadow:
        0 24px 70px rgba(70,29,9,.22),
        inset 0 1px 0 rgba(255,255,255,.84),
        inset 0 -1px 0 rgba(122,60,24,.08);
      backdrop-filter:blur(13px);
    }

    .brand-lockup{
      width:clamp(174px, 15vw, 232px);
      aspect-ratio:1 / 1;
      display:grid;
      place-items:center;
      margin:0 auto clamp(16px, 2vh, 22px);
      border-radius:50%;
      background:
        radial-gradient(circle at 50% 45%, rgba(255,255,255,.96) 0 46%, rgba(255,241,222,.84) 64%, transparent 72%);
      box-shadow:
        0 18px 42px rgba(75,30,10,.20),
        0 0 0 8px rgba(255,255,255,.52),
        0 0 0 1px rgba(255,114,22,.18);
    }
    .brand{
      width:104%;
      height:104%;
      object-fit:contain;
      filter:
        drop-shadow(0 12px 22px rgba(54,20,5,.24))
        drop-shadow(0 0 10px rgba(255,74,0,.12));
    }

    .headline{
      font-family:"Oswald", "Bebas Neue", Impact, sans-serif;
      text-transform:uppercase;
      line-height:.94;
      font-weight:700;
      letter-spacing:.032em;
      text-rendering:geometricPrecision;
    }
    .headline span{ display:block; white-space:nowrap; }
    .headline .dark{
      font-size:clamp(43px, 4.7vw, 70px);
      color:var(--brown);
      text-shadow:0 2px 0 rgba(255,255,255,.88), 0 12px 24px rgba(95,43,16,.12);
    }
    .headline .red{
      margin-top:clamp(9px,1vw,15px);
      font-size:clamp(36px, 3.9vw, 58px);
      letter-spacing:.024em;
      color:var(--red);
      background:linear-gradient(180deg, #ff5a2c 0%, #e72d12 50%, #a91405 100%);
      -webkit-background-clip:text;
      background-clip:text;
      -webkit-text-fill-color:transparent;
      filter:drop-shadow(0 6px 14px rgba(255,74,0,.16));
    }

    .lead{
      max-width:570px;
      margin:clamp(14px,1.6vw,22px) auto 0;
      font-size:clamp(16px,1.35vw,20px);
      line-height:1.5;
      font-weight:500;
      color:var(--muted);
    }

    .divider{
      width:min(560px, 94%);
      margin:clamp(18px,2vw,26px) auto;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:14px;
    }
    .divider::before,
    .divider::after,
    .footer-divider::before,
    .footer-divider::after{
      content:"";
      flex:1;
      height:2px;
      background:linear-gradient(90deg, transparent, rgba(227,43,18,.88));
      box-shadow:0 0 10px rgba(255,110,20,.18);
    }
    .divider::after,
    .footer-divider::after{ background:linear-gradient(90deg, rgba(227,43,18,.76), transparent); }
    .divider img{
      width:24px;
      height:30px;
      object-fit:contain;
      filter:drop-shadow(0 5px 10px rgba(227,43,18,.22));
    }

    .cards{
      display:grid;
      grid-template-columns:repeat(3, 1fr);
      gap:clamp(10px,1.5vw,16px);
      width:100%;
      margin:0 auto;
    }
    .card{
      min-height:clamp(86px, 8vw, 110px);
      position:relative;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:16px 12px 20px;
      border:1px solid var(--stroke);
      border-radius:18px;
      background:
        radial-gradient(circle at 50% 110%, rgba(255,127,34,.12), transparent 50%),
        linear-gradient(180deg, rgba(255,255,255,.96), rgba(255,248,239,.82));
      box-shadow:
        0 16px 30px rgba(89,38,13,.10),
        inset 0 1px 0 rgba(255,255,255,.82);
      overflow:hidden;
    }
    .card .txt{
      position:relative;
      font-family:"Oswald", "Bebas Neue", Impact, sans-serif;
      font-size:clamp(18px, 1.7vw, 24px);
      line-height:1.15;
      font-weight:700;
      text-transform:uppercase;
      letter-spacing:.02em;
      color:var(--brown);
    }
    .card .txt::after{
      content:"";
      display:block;
      width:52px;
      height:3px;
      margin:14px auto 0;
      border-radius:999px;
      background:linear-gradient(90deg, #e81407, #ff7a1e 50%, #e81407);
      box-shadow:0 0 10px rgba(255,95,21,.26);
    }

    .cta{
      position:relative;
      width:100%;
      min-height:64px;
      margin:clamp(20px,2vw,28px) auto 0;
      border:1px solid rgba(255,157,25,.96);
      border-radius:18px;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:0 74px 0 34px;
      overflow:hidden;
      background:
        radial-gradient(circle at 10% 16%, rgba(255,228,70,.32), transparent 10%),
        radial-gradient(circle at 72% 0%, rgba(255,127,0,.55), transparent 35%),
        radial-gradient(circle at 46% 125%, rgba(255,197,41,.48), transparent 34%),
        linear-gradient(180deg, #ed3916 0%, #a51204 48%, #f04a19 100%);
      color:#fff;
      font-family:"Oswald", "Bebas Neue", Impact, sans-serif;
      font-size:clamp(25px, 2.2vw, 32px);
      font-weight:700;
      letter-spacing:.075em;
      line-height:1;
      text-transform:uppercase;
      text-shadow:0 4px 12px rgba(0,0,0,.54);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.18),
        0 16px 32px rgba(138,31,5,.22),
        0 0 0 6px rgba(255,255,255,.34);
      transition:transform .22s ease, filter .22s ease, box-shadow .22s ease;
    }
    .cta::before{
      content:"";
      position:absolute;
      inset:0;
      background:
        linear-gradient(90deg, rgba(255,255,255,.18), transparent 32%, rgba(255,255,255,.12));
      opacity:.75;
      pointer-events:none;
    }
    .cta::after{
      content:"→";
      position:absolute;
      right:32px;
      top:50%;
      transform:translateY(-56%);
      font-family:Arial, sans-serif;
      font-size:38px;
      font-weight:300;
      color:#fff;
      text-shadow:0 0 12px rgba(255,255,255,.48);
    }
    .cta span{ position:relative; z-index:1; }
    .cta:hover{
      transform:translateY(-3px);
      filter:saturate(1.08) brightness(1.04);
      box-shadow:
        inset 0 0 0 1px rgba(255,255,255,.18),
        0 20px 40px rgba(138,31,5,.26),
        0 0 0 7px rgba(255,255,255,.42);
    }

    .gallery-shell{
      width:100%;
      margin:clamp(20px,2vw,28px) auto 0;
    }
    .gallery{
      display:grid;
      grid-template-columns:repeat(3, 1fr);
      gap:clamp(10px,1.4vw,16px);
    }
    .shot{
      position:relative;
      height:clamp(86px, 8vw, 116px);
      overflow:hidden;
      border-radius:18px;
      border:1px solid rgba(255,255,255,.72);
      background:#fff;
      box-shadow:
        0 16px 30px rgba(76,33,12,.13),
        0 0 0 1px rgba(126,59,24,.08);
      isolation:isolate;
    }
    .shot::after{
      content:"";
      position:absolute;
      inset:0;
      border-radius:inherit;
      background:
        linear-gradient(180deg, rgba(255,255,255,.08), transparent 34%, rgba(41,14,4,.12) 100%);
      pointer-events:none;
      z-index:2;
    }
    .shot img{
      position:relative;
      z-index:1;
      width:100%;
      height:100%;
      object-fit:cover;
      filter:contrast(1.04) saturate(1.08) brightness(1.06);
      transform:scale(1.04);
    }

    .footer-divider{
      width:min(560px, 94%);
      margin:clamp(16px,1.8vw,22px) auto 0;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:14px;
    }
    .footer-flame{
      width:36px;
      filter:drop-shadow(0 5px 10px rgba(227,43,18,.24));
      opacity:.96;
      flex:0 0 auto;
    }

    @media (min-width: 1024px) and (max-height: 820px){
      .shell{ padding-top:22px; padding-bottom:18px; }
      .content{ padding:24px 32px; }
      .brand-lockup{ width:166px; margin-bottom:14px; }
      .headline .dark{ font-size:48px; }
      .headline .red{ font-size:40px; margin-top:10px; }
      .lead{ font-size:16px; margin-top:14px; }
      .divider{ margin:15px auto; }
      .card{ min-height:76px; padding:12px 10px 16px; }
      .card .txt{ font-size:18px; }
      .card .txt::after{ margin-top:10px; height:2px; width:42px; }
      .cta{ min-height:54px; margin-top:16px; font-size:24px; }
      .gallery-shell{ margin-top:16px; }
      .shot{ height:72px; }
      .footer-divider{ margin-top:10px; }
      .footer-flame{ width:28px; }
    }

    @media (max-width: 760px){
      .page{ min-height:100dvh; overflow-y:auto; }
      .page::before{
        position:fixed;
        inset:0;
        background:url("assets/hero-churrasco.jpg") 70% 16% / cover no-repeat;
        filter:saturate(1.08) contrast(1.04) brightness(1.04);
        transform:none;
      }
      .page::after{
        position:fixed;
        background:
          linear-gradient(180deg, rgba(255,253,248,.78) 0%, rgba(255,248,239,.64) 26%, rgba(255,247,239,.88) 58%, rgba(255,253,248,.98) 100%),
          linear-gradient(90deg, rgba(255,253,248,.92), rgba(255,255,255,.44));
      }
      .embers{ opacity:.20; position:fixed; }
      .shell{
        width:100%;
        min-height:100dvh;
        padding:clamp(18px,4vw,28px) 12px max(16px, env(safe-area-inset-bottom));
        align-items:flex-start;
        justify-content:center;
      }
      .content{
        width:100%;
        max-width:420px;
        margin:0 auto;
        padding:22px 12px 16px;
        border-radius:24px;
        background:linear-gradient(180deg, rgba(255,255,255,.92), rgba(255,248,240,.88));
      }
      .brand-lockup{
        width:min(194px, 52vw);
        margin-bottom:14px;
      }
      .headline .dark{
        font-size:clamp(39px, 9.6vw, 46px);
        line-height:.95;
        letter-spacing:.035em;
      }
      .headline .red{
        margin-top:8px;
        font-size:clamp(29px, 7.8vw, 37px);
        letter-spacing:.01em;
      }
      .lead{
        max-width:390px;
        margin:13px auto 0;
        font-size:clamp(15px, 3.55vw, 17px);
        line-height:1.4;
      }
      .divider{ width:100%; margin:15px auto 13px; gap:10px; }
      .divider img{ width:20px; height:25px; }
      .cards{ width:100%; gap:8px; }
      .card{
        min-height:76px;
        border-radius:13px;
        padding:10px 5px 13px;
      }
      .card .txt{
        font-size:clamp(14px, 3.5vw, 16px);
        line-height:1.14;
      }
      .card .txt::after{ width:40px; height:2px; margin-top:11px; }
      .cta{
        min-height:62px;
        margin-top:17px;
        border-radius:14px;
        padding:0 58px 0 22px;
        font-size:clamp(22px, 5.8vw, 28px);
        letter-spacing:.055em;
      }
      .cta::after{ right:24px; font-size:34px; }
      .gallery-shell{ margin-top:15px; }
      .gallery{ gap:8px; }
      .shot{ height:70px; border-radius:12px; }
      .footer-divider{ width:100%; margin-top:13px; gap:10px; }
      .footer-flame{ width:30px; }
    }

    @media (max-width: 380px){
      .shell{ padding-left:9px; padding-right:9px; }
      .content{ padding:18px 9px 13px; }
      .brand-lockup{ width:min(174px, 50vw); margin-bottom:12px; }
      .headline .dark{ font-size:35px; }
      .headline .red{ font-size:28px; }
      .lead{ font-size:14px; margin-top:12px; }
      .card{ min-height:66px; }
      .card .txt{ font-size:13px; }
      .cta{ min-height:56px; margin-top:16px; font-size:21px; }
      .shot{ height:60px; }
      .footer-flame{ width:27px; }
    }
  </style>
</head>
<body>
  <main class="page" aria-label="Churrasco Prime Premium para Eventos">
    <div class="embers" aria-hidden="true"></div>

    <section class="shell">
      <div class="content">
        <div class="brand-lockup" aria-label="Logo Churrasco Prime Premium Events 2026">
          <img class="brand" src="assets/logo-round-black.png" alt="Churrasco Prime Premium Events 2026">
        </div>

        <h1 class="headline">
          <span class="dark">Churrasco</span>
          <span class="red">Premium para Eventos</span>
        </h1>

        <p class="lead">Transformamos momentos em experiências inesquecíveis ao redor do fogo.</p>

        <div class="divider" aria-hidden="true">
          <img src="assets/flame-transparent.png" alt="">
        </div>

        <div class="cards" aria-label="Tipos de eventos atendidos">
          <article class="card"><div class="txt">Eventos<br>Corporativos</div></article>
          <article class="card"><div class="txt">Aniversários</div></article>
          <article class="card"><div class="txt">Resenhas<br>&amp; BBQ</div></article>
        </div>

        <a class="cta" href="https://wa.me/5500000000000?text=Ol%C3%A1%2C%20quero%20solicitar%20um%20or%C3%A7amento%20para%20evento." aria-label="Solicitar orçamento pelo WhatsApp">
          <span>Solicitar orçamento</span>
        </a>

        <div class="gallery-shell" aria-label="Galeria Churrasco Prime">
          <div class="gallery">
            <figure class="shot"><img src="assets/carvao.jpg" alt="Carvão em brasa"></figure>
            <figure class="shot"><img src="assets/faca.jpg" alt="Faca sobre tábua rústica"></figure>
            <figure class="shot"><img src="assets/carne-principal.jpg" alt="Carne premium fatiada"></figure>
          </div>
        </div>

        <div class="footer-divider" aria-hidden="true">
          <img class="footer-flame" src="assets/flame-transparent.png" alt="" aria-hidden="true">
        </div>
      </div>
    </section>
  </main>
</body>
</html>
