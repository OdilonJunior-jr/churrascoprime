<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Churrasco Prime | Premium para Eventos</title>
  <meta name="description" content="Churrasco premium para eventos corporativos, aniversários, resenhas e BBQ." />

  <!-- Vercel Web Analytics (projeto HTML estático) -->
  <script>
    window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
  </script>
  <script defer src="/_vercel/insights/script.js"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@400;500;600;700;800;900&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">

  <style>
    :root{
      --black:#000;
      --white:#fff;
      --red:#ed2a10;
      --red-dark:#9d1205;
      --orange:#ff7908;
      --amber:#ffb027;
      --line:rgba(255,116,10,.76);
      --border:rgba(255,132,16,.82);
      --text:#f6f6f6;
      --muted:#eeeeee;
      --shadow:rgba(0,0,0,.82);
    }

    *{ box-sizing:border-box; margin:0; padding:0; }
    html{ background:#000; scroll-behavior:smooth; }
    body{
      min-height:100svh;
      color:var(--text);
      font-family:"Montserrat", Arial, sans-serif;
      background:#000;
      overflow-x:hidden;
    }
    img{ display:block; max-width:100%; }
    a{ color:inherit; text-decoration:none; }

    .page{
      position:relative;
      min-height:100svh;
      isolation:isolate;
      overflow:hidden;
      background:
        radial-gradient(circle at 18% 20%, rgba(255,69,0,.08), transparent 22%),
        radial-gradient(circle at 80% 86%, rgba(255,30,0,.10), transparent 24%),
        #000;
    }

    .page::before{
      content:"";
      position:absolute;
      inset:0;
      z-index:-3;
      background:#000 url("assets/hero-desktop.png") center center / cover no-repeat;
      filter:saturate(1.03) contrast(1.02) brightness(1.02);
      transform:scale(1.01);
    }

    .page::after{
      content:"";
      position:absolute;
      inset:0;
      z-index:-2;
      pointer-events:none;
      background:
        linear-gradient(180deg,
          rgba(0,0,0,0) 0%,
          rgba(0,0,0,0) 46%,
          rgba(0,0,0,.18) 68%,
          rgba(0,0,0,.58) 88%,
          rgba(0,0,0,.82) 100%);
    }

    .embers{
      position:absolute;
      inset:0;
      z-index:-1;
      pointer-events:none;
      opacity:.62;
      background:
        radial-gradient(circle at 8% 23%, rgba(255,75,0,.50) 0 1px, transparent 3px),
        radial-gradient(circle at 23% 66%, rgba(255,126,0,.45) 0 1px, transparent 3px),
        radial-gradient(circle at 38% 18%, rgba(255,67,0,.42) 0 1px, transparent 3px),
        radial-gradient(circle at 67% 70%, rgba(255,116,0,.34) 0 1px, transparent 3px),
        radial-gradient(circle at 92% 62%, rgba(255,64,0,.45) 0 1px, transparent 3px);
      background-size:310px 290px, 260px 330px, 380px 360px, 460px 380px, 330px 300px;
      mix-blend-mode:screen;
    }

    .shell{
      width:min(1180px, 100%);
      min-height:100svh;
      margin:0 auto;
      padding:clamp(30px,4vh,56px) clamp(18px,4vw,56px) clamp(22px,3vw,40px);
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:flex-start;
      gap:clamp(18px,3vh,30px);
    }

    .brand{
      width:clamp(168px, 13.6vw, 200px);
      height:auto;
      display:block;
      margin:0 auto 22px;
      filter:drop-shadow(0 18px 28px rgba(0,0,0,.96)) drop-shadow(0 0 14px rgba(255,255,255,.10)) drop-shadow(0 0 18px rgba(255,66,0,.18));
      opacity:.99;
    }

    .content{
      width:min(680px, 100%);
      margin:0 auto;
      text-align:center;
      padding:clamp(92px,16vh,160px) 0 0;
      text-shadow:0 8px 24px rgba(0,0,0,.92);
    }

    .headline{
      font-family:"Oswald", "Bebas Neue", Impact, sans-serif;
      text-transform:uppercase;
      line-height:.92;
      font-weight:700;
      letter-spacing:.035em;
      text-rendering:geometricPrecision;
    }
    .headline span{ display:block; white-space:nowrap; }
    .headline .white{
      font-size:clamp(42px, 4.7vw, 68px);
      color:#f7f7f7;
      text-shadow:
        0 2px 0 rgba(0,0,0,.96),
        0 4px 0 rgba(130,130,130,.42),
        0 12px 28px rgba(0,0,0,.96);
      filter:contrast(1.08);
    }
    .headline .red{
      margin-top:clamp(10px,1.2vw,18px);
      font-size:clamp(38px, 4vw, 58px);
      letter-spacing:.028em;
      color:var(--red);
      background:linear-gradient(180deg, #ff4520 0%, #ef260e 48%, #b41405 100%);
      -webkit-background-clip:text;
      background-clip:text;
      -webkit-text-fill-color:transparent;
      text-shadow:none;
      filter:drop-shadow(0 0 10px rgba(255,43,0,.18));
    }

    .lead{
      max-width:600px;
      margin:clamp(14px,1.6vw,24px) auto 0;
      font-size:clamp(16px,1.35vw,20px);
      line-height:1.5;
      font-weight:400;
      color:#f5f5f5;
    }

    .divider{
      width:min(620px, 88%);
      margin:clamp(18px,2vw,28px) auto clamp(18px,2vw,28px);
      display:flex;
      align-items:center;
      justify-content:center;
      gap:14px;
    }
    .divider::before,
    .divider::after{
      content:"";
      flex:1;
      height:2px;
      background:linear-gradient(90deg, transparent, rgba(255,105,8,.98));
      box-shadow:0 0 14px rgba(255,66,0,.48);
    }
    .divider::after{ background:linear-gradient(90deg, rgba(255,105,8,.95), transparent); }
    .divider::before,
    .divider::after,
    .footer-divider::before,
    .footer-divider::after{ opacity:1; }
    .divider img{
      width:24px;
      height:30px;
      object-fit:contain;
      filter:drop-shadow(0 0 10px rgba(255,54,0,.85));
    }

    .cards{
      display:grid;
      grid-template-columns:repeat(3, 1fr);
      gap:clamp(10px,1.5vw,18px);
      width:min(720px, 100%);
      margin:0 auto;
    }
    .card{
      min-height:clamp(86px, 8vw, 112px);
      position:relative;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:16px 12px 20px;
      border:none;
      border-radius:15px;
      background:
        radial-gradient(circle at 50% 120%, rgba(255,72,0,.10), transparent 52%),
        linear-gradient(180deg, rgba(255,255,255,.045), rgba(255,255,255,.008) 46%),
        rgba(6,6,6,.66);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.035),
        inset 0 -22px 30px rgba(255,56,0,.035),
        0 16px 34px rgba(0,0,0,.56),
        0 0 22px rgba(255,84,0,.045);
      backdrop-filter:blur(7px);
      overflow:hidden;
    }
    .card::before{
      content:"";
      position:absolute;
      inset:0;
      border-radius:inherit;
      background:linear-gradient(180deg, rgba(255,255,255,.035), transparent 32%, rgba(255,80,0,.03) 100%);
      opacity:.9;
      pointer-events:none;
    }
    .card::after{
      content:"";
      position:absolute;
      inset:1px;
      border-radius:14px;
      box-shadow:inset 0 0 0 1px rgba(255,255,255,.02);
      pointer-events:none;
    }
    .card .txt{
      position:relative;
      font-family:"Oswald", "Bebas Neue", Impact, sans-serif;
      font-size:clamp(18px, 1.75vw, 24px);
      line-height:1.15;
      font-weight:600;
      text-transform:uppercase;
      letter-spacing:.02em;
      color:#f7f7f7;
      text-shadow:0 5px 15px #000, 0 0 8px rgba(255,255,255,.18);
    }
    .card .txt::after{
      content:"";
      display:block;
      width:52px;
      height:3px;
      margin:14px auto 0;
      border-radius:999px;
      background:linear-gradient(90deg, #e81407, #ff7a1e 50%, #e81407);
      box-shadow:0 0 10px rgba(255,36,0,.74);
    }

    .cta{
      position:relative;
      width:min(700px, 100%);
      min-height:62px;
      margin:clamp(20px,2vw,28px) auto 0;
      border:1px solid rgba(255,157,25,.82);
      border-radius:16px;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:0 74px 0 34px;
      overflow:hidden;
      background:
        radial-gradient(circle at 10% 16%, rgba(255,228,70,.32), transparent 10%),
        radial-gradient(circle at 72% 0%, rgba(255,127,0,.55), transparent 35%),
        radial-gradient(circle at 46% 125%, rgba(255,197,41,.48), transparent 34%),
        linear-gradient(180deg, #d52208 0%, #8f0d03 47%, #ee3711 100%);
      color:#fff;
      font-family:"Oswald", "Bebas Neue", Impact, sans-serif;
      font-size:clamp(25px, 2.2vw, 32px);
      font-weight:700;
      letter-spacing:.075em;
      line-height:1;
      text-transform:uppercase;
      text-shadow:0 4px 12px rgba(0,0,0,.76);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.12),
        inset 0 -10px 16px rgba(255,70,0,.20),
        0 0 28px rgba(255,50,0,.22),
        0 18px 30px rgba(0,0,0,.56);
      transition:transform .22s ease, filter .22s ease, box-shadow .22s ease;
    }
    .cta::before{
      content:"";
      position:absolute;
      inset:0;
      background:
        radial-gradient(circle at 7% 58%, rgba(255,205,55,.68) 0 1px, transparent 3px),
        radial-gradient(circle at 18% 20%, rgba(255,156,0,.60) 0 1px, transparent 3px),
        radial-gradient(circle at 31% 68%, rgba(255,85,0,.54) 0 1px, transparent 3px),
        radial-gradient(circle at 49% 36%, rgba(255,197,32,.48) 0 1px, transparent 3px),
        radial-gradient(circle at 80% 60%, rgba(255,93,0,.54) 0 1px, transparent 3px),
        linear-gradient(90deg, rgba(255,255,255,.16), transparent 32%, rgba(255,255,255,.10));
      opacity:.72;
      pointer-events:none;
    }
    .cta .curve-shadow{
      position:absolute;
      inset:0;
      border-radius:inherit;
      pointer-events:none;
      background:linear-gradient(180deg, rgba(255,255,255,.12), transparent 24%, transparent 70%, rgba(120,0,0,.12) 100%);
      mix-blend-mode:screen;
    }
    .cta::after{
      content:"→";
      position:absolute;
      right:32px;
      top:50%;
      transform:translateY(-56%);
      font-family:Arial, sans-serif;
      font-size:38px;
      font-weight:300;
      color:#fff;
      text-shadow:0 0 12px rgba(255,255,255,.48);
    }
    .cta span{ position:relative; z-index:1; }
    .cta:hover{
      transform:translateY(-3px);
      filter:saturate(1.12) brightness(1.04);
      box-shadow:
        inset 0 0 0 1px rgba(255,255,255,.14),
        0 0 34px rgba(255,64,0,.38),
        0 22px 38px rgba(0,0,0,.66);
    }

    .gallery{
      width:min(760px, 100%);
      margin:clamp(22px,2.2vw,30px) auto 0;
      display:grid;
      grid-template-columns:repeat(3, 1fr);
      gap:clamp(12px,1.6vw,18px);
    }
    .shot{
      position:relative;
      height:clamp(82px, 8vw, 118px);
      overflow:hidden;
      border-radius:16px;
      border:none;
      background:#050505;
      box-shadow:
        0 18px 28px rgba(0,0,0,.60),
        0 0 24px rgba(255,70,0,.06);
      isolation:isolate;
    }
    .shot::before{
      content:"";
      position:absolute;
      inset:-10px;
      border-radius:22px;
      background:rgba(255,90,0,.06);
      filter:blur(14px);
      z-index:0;
      opacity:.85;
    }
    .shot::after{
      content:"";
      position:absolute;
      inset:0;
      border-radius:inherit;
      background:
        radial-gradient(circle at 50% 50%, transparent 56%, rgba(0,0,0,.08) 74%, rgba(0,0,0,.32) 100%),
        linear-gradient(180deg, rgba(255,255,255,.05), transparent 26%, rgba(0,0,0,.14) 100%);
      box-shadow:inset 0 0 22px rgba(0,0,0,.34);
      pointer-events:none;
      z-index:2;
    }
    .shot img{
      position:relative;
      z-index:1;
      width:100%;
      height:100%;
      object-fit:cover;
      filter:contrast(1.06) saturate(1.08) brightness(.84);
      transform:scale(1.045);
    }
    .shot:nth-child(1) img{ object-position:center center; }
    .shot:nth-child(2) img{ object-position:center center; }
    .shot:nth-child(3) img{ object-position:center center; }

    .gallery-shell{
      width:min(760px, 100%);
      margin:clamp(22px,2.2vw,30px) auto 0;
      position:relative;
      padding-bottom:0;
    }
    .gallery-shell .gallery{
      width:100%;
      margin:0 auto;
    }

    .footer-divider{
      width:min(620px, 88%);
      margin:clamp(14px,1.5vw,22px) auto 0;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:14px;
    }
    .footer-divider::before,
    .footer-divider::after{
      content:"";
      flex:1;
      height:2px;
      background:linear-gradient(90deg, transparent, rgba(255,122,20,.98));
      box-shadow:0 0 12px rgba(255,70,0,.34);
      opacity:1;
    }
    .footer-divider::after{
      background:linear-gradient(90deg, rgba(255,122,20,.88), transparent);
    }
    .footer-flame{
      width:38px;
      filter:drop-shadow(0 0 13px rgba(255,53,0,.90));
      opacity:.96;
      flex:0 0 auto;
    }

    @media (min-width: 1024px) and (max-height: 820px){
      .shell{ padding-top:22px; padding-bottom:18px; }
      .brand{ width:168px; margin-bottom:14px; }
      .headline .white{ font-size:46px; }
      .headline .red{ font-size:40px; margin-top:10px; }
      .lead{ font-size:16px; margin-top:14px; }
      .divider{ margin:15px auto; }
      .cards{ width:650px; }
      .card{ min-height:78px; padding:12px 10px 16px; }
      .card .txt{ font-size:18px; }
      .card .txt::after{ margin-top:10px; height:2px; width:42px; }
      .cta{ min-height:54px; width:640px; margin-top:16px; font-size:24px; }
      .gallery{ width:670px; margin-top:16px; }
      .shot{ height:72px; }
      .footer-divider{ margin-top:10px; }
      .footer-flame{ width:28px; }
    }

    @media (max-width: 680px){
      .page{
        min-height:100dvh;
        overflow-x:hidden;
        overflow-y:auto;
        background:#000;
      }
      .page::before{
        display:block;
        position:fixed;
        inset:0;
        z-index:-3;
        background:#000 url("assets/hero-mobile.png") center top / 100% auto no-repeat;
        filter:saturate(1.03) contrast(1.02) brightness(1.03);
        transform:none;
      }
      .page::after{
        display:block;
        position:fixed;
        inset:0;
        z-index:-2;
        background:
          linear-gradient(180deg,
            rgba(0,0,0,0) 0%,
            rgba(0,0,0,0) 40%,
            rgba(0,0,0,.10) 58%,
            rgba(0,0,0,.42) 76%,
            rgba(0,0,0,.78) 92%,
            #000 100%);
      }
      .embers{ opacity:.50; position:fixed; }
      .shell{
        width:100%;
        max-width:none;
        min-height:100dvh;
        margin:0;
        padding:0 0 max(12px, env(safe-area-inset-bottom));
        justify-content:flex-start;
        gap:0;
        overflow:visible;
        position:relative;
        background:none;
      }
      .shell::before{ display:none; }
      .brand,
      .content{ position:relative; z-index:1; }
      .content{
        width:100%;
        max-width:404px;
        min-height:auto;
        margin:0 auto;
        padding:118px 10px 14px;
        display:flex;
        flex-direction:column;
        justify-content:flex-start;
      }
      .brand{
        width:170px;
        margin:0 auto 18px;
        filter:drop-shadow(0 14px 22px rgba(0,0,0,.96)) drop-shadow(0 0 12px rgba(255,255,255,.10)) drop-shadow(0 0 10px rgba(255,69,0,.14));
      }
      .headline .white{
        font-size:clamp(40px, 9.8vw, 46px);
        line-height:.95;
        letter-spacing:.04em;
      }
      .headline .red{
        margin-top:8px;
        font-size:clamp(30px, 7.9vw, 37px);
        letter-spacing:.01em;
      }
      .lead{
        max-width:390px;
        margin:14px auto 0;
        font-size:clamp(15px, 3.6vw, 17px);
        line-height:1.38;
      }
      .divider{
        width:100%;
        margin:16px auto 14px;
        gap:10px;
      }
      .divider::before,
      .divider::after,
      .footer-divider::before,
      .footer-divider::after{ opacity:1; }
      .divider img{ width:20px; height:25px; }
      .cards{
        width:100%;
        gap:8px;
        margin-top:2px;
      }
      .card{
        min-height:76px;
        border-radius:11px;
        padding:10px 5px 13px;
        background:rgba(5,5,5,.74);
        box-shadow:0 12px 24px rgba(0,0,0,.72), inset 0 -16px 18px rgba(255,100,0,.03), inset 0 1px 0 rgba(255,255,255,.03);
        backdrop-filter:none;
      }
      .card .txt{
        font-size:clamp(14px, 3.55vw, 16px);
        line-height:1.14;
      }
      .card .txt::after{
        width:40px;
        height:2px;
        margin-top:11px;
      }
      .cta{
        width:100%;
        min-height:66px;
        margin-top:18px;
        border-radius:12px;
        padding:0 60px 0 26px;
        font-size:clamp(23px, 6vw, 29px);
        letter-spacing:.055em;
      }
      .cta::after{ right:24px; font-size:34px; }
      .gallery-shell{
        width:100%;
        margin-top:16px;
        padding-bottom:0;
      }
      .gallery{
        width:100%;
        margin-top:0;
        gap:9px;
      }
      .shot{
        height:72px;
        border-radius:10px;
        box-shadow:0 10px 22px rgba(0,0,0,.74), 0 0 14px rgba(255,70,0,.06);
      }
      .shot::before{ inset:-8px; filter:blur(12px); }
      .shot::after{ box-shadow:inset 0 0 16px rgba(0,0,0,.30); }
      .footer-divider{
        width:100%;
        margin-top:14px;
        padding-top:0;
        gap:10px;
      }
      .footer-flame{
        width:32px;
      }
    }

@media (max-width: 380px){
      .shell{ padding-top:0; }
      .content{ min-height:auto; padding:108px 8px 12px; }
      .brand{ width:158px; margin:0 auto 18px; }
      .headline .white{ font-size:36px; }
      .headline .red{ font-size:29px; }
      .lead{ font-size:14px; margin-top:12px; }
      .divider{ width:100%; margin:16px auto 14px; }
      .card{ min-height:68px; }
      .card .txt{ font-size:13px; }
      .cta{ min-height:58px; margin-top:18px; font-size:22px; }
      .gallery-shell{ margin-top:14px; padding-bottom:0; }
      .gallery{ margin-top:0; }
      .shot{ height:62px; }
      .footer-divider{ width:100%; margin-top:12px; padding-top:0; }
      .footer-flame{ width:28px; }
    }
  

    /* Ajuste final do logo: maior, mais limpo e com base escura para leitura no hero */
    .content{
      padding-top:clamp(54px, 8vh, 92px);
    }
    .brand-lockup{
      width:clamp(220px, 18vw, 272px);
      aspect-ratio:1 / 1;
      display:grid;
      place-items:center;
      margin:0 auto clamp(18px, 2.2vh, 26px);
      border-radius:50%;
      background:
        radial-gradient(circle at 50% 48%, rgba(0,0,0,.86) 0 58%, rgba(0,0,0,.50) 67%, rgba(0,0,0,.12) 76%, transparent 78%);
      box-shadow:
        0 22px 40px rgba(0,0,0,.78),
        0 0 0 1px rgba(255,255,255,.06),
        0 0 38px rgba(255,75,0,.18);
      filter:drop-shadow(0 12px 24px rgba(0,0,0,.78));
    }
    .brand{
      width:108%;
      height:108%;
      object-fit:contain;
      margin:0;
      opacity:1;
      filter:
        drop-shadow(0 6px 12px rgba(0,0,0,.74))
        drop-shadow(0 0 10px rgba(255,255,255,.10))
        drop-shadow(0 0 16px rgba(255,66,0,.22));
    }

    @media (max-width: 680px){
      .content{
        max-width:420px;
        padding:clamp(48px, 7.4vh, 70px) 12px 14px;
      }
      .brand-lockup{
        width:min(220px, 56vw);
        margin-bottom:14px;
        box-shadow:
          0 18px 32px rgba(0,0,0,.86),
          0 0 0 1px rgba(255,255,255,.05),
          0 0 26px rgba(255,75,0,.14);
      }
      .brand{ width:109%; height:109%; }
    }

    @media (max-width: 380px){
      .content{ padding:40px 10px 12px; }
      .brand-lockup{ width:min(196px, 55vw); margin-bottom:12px; }
    }


    /* Galeria rotativa: 3 cards trocando em tempos diferentes sem repetir a mesma foto ao mesmo tempo */
    .shot img{
      transition:opacity .34s ease, transform .34s ease, filter .34s ease;
      will-change:opacity, transform, filter;
    }
    .shot.is-changing img{
      opacity:.16;
      transform:scale(1.10);
      filter:contrast(1.08) saturate(1.08) brightness(.62) blur(.5px);
    }
    .shot:hover img{
      transform:scale(1.08);
      filter:contrast(1.08) saturate(1.12) brightness(.93);
    }

  </style>
</head>
<body>
  <main class="page" aria-label="Churrasco Prime Premium para Eventos">
    <div class="embers" aria-hidden="true"></div>

    <section class="shell">

  <script>
    // Evento do CTA principal: aparece em Custom Events quando disponível no plano da Vercel.
    document.addEventListener('DOMContentLoaded', () => {
      const cta = document.querySelector('.cta');
      if (!cta) return;
      cta.addEventListener('click', () => {
        if (typeof window.va === 'function') {
          window.va('event', {
            name: 'Solicitar orçamento',
            data: { canal: 'WhatsApp', origem: 'CTA principal' }
          });
        }
      });
    });
  </script>

  <script>
    (() => {
      const galleryPool = [
        { src: "assets/gallery/galeria-01-carvao.jpg", alt: "Carvão em brasa" },
        { src: "assets/gallery/galeria-02-faca.jpg", alt: "Faca sobre tábua rústica" },
        { src: "assets/gallery/galeria-03-carne-principal.jpg", alt: "Carne premium fatiada" },
        { src: "assets/gallery/galeria-04-carne-close.jpg", alt: "Carne grelhada fatiada" },
        { src: "assets/gallery/galeria-05-pao-alho.jpg", alt: "Pão de alho artesanal" },
        { src: "assets/gallery/galeria-06-espetinhos.jpg", alt: "Espetinhos e cortes na churrasqueira" },
        { src: "assets/gallery/galeria-07-picanha-tabua.jpg", alt: "Picanha fatiada na tábua" },
        { src: "assets/gallery/galeria-08-churrasqueira.jpg", alt: "Churrasco sendo preparado na grelha" },
        { src: "assets/gallery/galeria-09-buffet-carnes.jpg", alt: "Buffet de carnes premium" },
        { src: "assets/gallery/galeria-10-entradas.jpg", alt: "Entradas e acompanhamentos de churrasco" },
        { src: "assets/gallery/galeria-11-linguicas.jpg", alt: "Linguiças e cortes servidos na tábua" },
        { src: "assets/gallery/galeria-12-picanha-tabua-close.jpg", alt: "Picanha ao ponto com tomates" }
      ];

      const speeds = [2000, 1800, 2100];
      const cards = Array.from(document.querySelectorAll("#galleryRotativa [data-rotator]"));
      const current = new Map();
      const initialOffset = [350, 900, 1450];

      if (!cards.length || galleryPool.length < cards.length) return;

      const preload = () => {
        galleryPool.forEach((item) => {
          const img = new Image();
          img.src = item.src;
        });
      };

      const randomItem = (slotIndex) => {
        const usedByOtherCards = new Set(
          [...current.entries()]
            .filter(([index]) => index !== slotIndex)
            .map(([, src]) => src)
        );
        const ownCurrent = current.get(slotIndex);
        const available = galleryPool.filter((item) => !usedByOtherCards.has(item.src) && item.src !== ownCurrent);
        const fallback = galleryPool.filter((item) => item.src !== ownCurrent);
        const options = available.length ? available : fallback.length ? fallback : galleryPool;
        return options[Math.floor(Math.random() * options.length)];
      };

      const setCardImage = (card, item, animated = true) => {
        const img = card.querySelector("img");
        if (!img || !item) return;
        const slotIndex = Number(card.dataset.rotator || 0);
        current.set(slotIndex, item.src);

        if (!animated) {
          img.src = item.src;
          img.alt = item.alt;
          return;
        }

        card.classList.add("is-changing");
        window.setTimeout(() => {
          img.src = item.src;
          img.alt = item.alt;
          window.requestAnimationFrame(() => card.classList.remove("is-changing"));
        }, 220);
      };

      const shuffle = (items) => {
        const array = [...items];
        for (let i = array.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
      };

      const start = () => {
        const firstImages = shuffle(galleryPool).slice(0, cards.length);

        cards.forEach((card, index) => {
          setCardImage(card, firstImages[index], false);
          window.setTimeout(function rotateLoop(){
            setCardImage(card, randomItem(index), true);
            window.setTimeout(rotateLoop, speeds[index]);
          }, speeds[index] + initialOffset[index]);
        });
      };

      preload();
      start();
    })();
  </script>
